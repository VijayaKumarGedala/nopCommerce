pool:
  vmImage: ubuntu-latest

trigger: none

steps:
  - task: DotNetCoreCLI@2
    displayName: Clean
    inputs:
      command: 'clean'
      projects: '**/*.csproj'

  - task: DotNetCoreCLI@2
    displayName: Restore
    inputs:
      command: 'restore'
      projects: '**/*.csproj'

  - task: DotNetCoreCLI@2  
    displayName: Build plugins
    inputs:
      command: 'build' 
      projects: './src/plugins/**/*.csproj'

  - task: Bash@3
    displayName: 'Set Permissions'
    inputs:
      targetType: 'inline'
      script: |
        sudo mkdir -p /Presentation/Nop.Web/Plugins/DiscountRules.CustomerRoles
        sudo chown -R $(whoami) /Presentation
        sudo chmod -R 777 /Presentation

  - task: Bash@3
    displayName: 'Check for Conflicting Files'
    inputs:
      targetType: 'inline'
    script: |
      if [ -f "/Presentation" ]; then
        echo "A file named 'Presentation' exists. Removing it."
        sudo rm /Presentation
      fi

  - task: DotNetCoreCLI@2
    displayName: Build
    inputs:
      command: 'build'
      projects: '**/*.csproj'
      arguments: '--configuration Release'

  - task: DotNetCoreCLI@2  
    displayName: Test
    inputs:
      command: 'test'
      projects: '**/*.csproj'
      publishTestResults: true
      testResultsFiles: '**/TestResults/*.xml'

  - task: DotNetCoreCLI@2  
    displayName: Publish
    inputs:
      command: 'publish'
      projects: '**/*.csproj'
      arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)'

  - task: PublishBuildArtifacts@1  
    displayName: Publish Artifact
    inputs:
      pathToPublish: '$(Build.ArtifactStagingDirectory)'
      artifactName: 'drop'
